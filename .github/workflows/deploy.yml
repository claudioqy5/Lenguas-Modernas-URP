name: Deploy to VPS

on:
  push:
    branches:
      - main # O la rama que uses como principal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Copy files to VPS via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: "."
        target: "~/asistencia-lenguas-modernas"
        rm: true

    - name: Execute Docker Compose on VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          cd ~/asistencia-lenguas-modernas
          # Detener contenedores antiguos si existen
          docker compose down || docker-compose down
          # Levantar con la nueva versión
          docker compose up -d --build || docker-compose up -d --build
